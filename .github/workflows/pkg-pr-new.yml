name: Publish preview package

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to regenerate both SDKs against (resolved from each package sdk.config.ts)'
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
          - staging1
          - staging2
          - staging3
      api_version:
        description: 'Target API version (YYYY-MM). Leave empty for latest. Rejected against legacy-shape hosts (e.g. production today).'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    name: pkg.pr.new
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate both SDKs against ${{ inputs.environment }}
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          ARGS="--env=${{ inputs.environment }}"
          if [ -n "${{ inputs.api_version }}" ]; then
            ARGS="$ARGS --api-version=${{ inputs.api_version }}"
          fi
          # Invoke tsx directly: `pnpm generate` chains `&& pnpm check`, and pnpm
          # appends user args to the LAST command in the chain — so
          # `pnpm generate --env=…` would hand the flag to `pnpm check` instead.
          # --env resolves through each package's own sdk.config.ts environments
          # map, so this step needs no knowledge of which API it is generating.
          for pkg in @commercelayer/sdk @commercelayer/provisioning-sdk; do
            echo "::group::regenerate $pkg"
            pnpm --filter "$pkg" exec tsx ../sdk-generator/src/generator.ts $ARGS
            echo '::endgroup::'
          done
          pnpm check

      - name: Commit + push to pkg-pr-new-${{ inputs.environment }}
        id: regen_commit
        if: github.event_name == 'workflow_dispatch' && inputs.environment != 'production'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: regenerate SDKs against ${{ inputs.environment }}'
          branch: 'pkg-pr-new-${{ inputs.environment }}'
          push_options: '--force'
          create_branch: true
          commit_user_name: 'commercelayer-ci'
          commit_user_email: 'ci@commercelayer.io'

      # Production goes through a PR to main: the action commits, force-pushes
      # pkg-pr-new-production and opens the PR, or updates it if already open.
      - name: Commit + open PR to main (production only)
        id: create_pr
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COMMERCELAYER_CI_TOKEN }}
          branch: pkg-pr-new-production
          base: main
          commit-message: 'chore: regenerate SDKs against production'
          committer: commercelayer-ci <ci@commercelayer.io>
          author: commercelayer-ci <ci@commercelayer.io>
          title: 'Regenerate schema from production'
          labels: enhancement
          reviewers: |
            malessani
            gciotola
            marcomontalbano
            pfferrari
          body: |
            Automated schema regen via workflow dispatch.

            The install URLs of the preview are in the comment below, updated on every regeneration.

      # The action leaves the original commit checked out, while pkg-pr-new
      # publishes under `git rev-parse HEAD`: check out the PR head, so the
      # preview is built from it and published under its sha. Skipped when the
      # regeneration changed nothing (no PR head).
      - name: Check out the PR head (production only)
        if: steps.create_pr.outputs.pull-request-head-sha != ''
        env:
          HEAD_SHA: ${{ steps.create_pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin pkg-pr-new-production
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::pkg-pr-new-production is at $(git rev-parse FETCH_HEAD), expected ${HEAD_SHA}."
            exit 1
          fi
          git checkout --force --detach "$HEAD_SHA"

      - name: Build package
        run: pnpm build

      # pkg-pr-new keeps one comment per PR, edited on every publish;
      # `--commentWithSha` makes its install URLs point to the commit rather than
      # to the PR number. A dispatch has no PR event, so the production PR gets
      # its comment from the pull_request run its own push triggers.
      - name: Publish preview
        run: npx pkg-pr-new publish --no-template --commentWithSha './packages/*'

      # The run summary, for every run: a dispatch for a staging environment has
      # no PR, so this is where its install URLs are.
      - name: Print install URLs
        run: |
          # The sha pkg-pr-new published under, in three cases:
          #  1. A dispatch that regenerated: the commit step (staging) or the PR
          #     action (production) pushed a NEW commit and the preview is built
          #     from it, so `github.sha` (the dispatched ref) is stale. Take the
          #     hash the action reports. Reading it from the action rather than
          #     `git rev-parse` keeps this correct even if a later step moves HEAD.
          #  2. A pull_request: the checkout is a merge commit, so HEAD does not
          #     match what pkg-pr-new used — it takes the head sha.
          #  3. A push, or a dispatch that regenerated to no change: HEAD is
          #     already the published commit.
          FULL='${{ steps.regen_commit.outputs.commit_hash }}'
          [ -n "$FULL" ] || FULL='${{ steps.create_pr.outputs.pull-request-head-sha }}'
          [ -n "$FULL" ] || FULL='${{ github.event.pull_request.head.sha }}'
          [ -n "$FULL" ] || FULL="$(git rev-parse HEAD)"
          SHA="${FULL:0:7}"
          REPO='${{ github.repository }}'
          ENV='${{ inputs.environment }}'
          API_VERSION='${{ inputs.api_version }}'
          {
            echo '### Preview packages'
            echo
            # `environment` only exists on workflow_dispatch. On push and
            # pull_request the regenerate step is skipped, so the preview is
            # built from whatever the branch already contains — say so rather
            # than implying it was generated against production.
            # A list, not consecutive lines: GitHub-flavored markdown folds a
            # single newline into the same paragraph, which would run the two
            # fields together on one line.
            if [ -n "$ENV" ]; then
              echo "- **Environment:** \`${ENV}\`"
              [ -n "$API_VERSION" ] && echo "- **API version:** \`${API_VERSION}\`"
            else
              echo '- **Environment:** as committed — no regeneration on this event'
            fi
            # The published commit, so the summary can be trusted without
            # cross-checking git. On a regenerating dispatch this is the commit
            # the run itself created, not the one it was dispatched from.
            echo "- **Commit:** [\`${SHA}\`](https://github.com/${REPO}/commit/${FULL})"
            if [ -n "${{ steps.regen_commit.outputs.commit_hash }}" ]; then
              echo "- **Pushed to:** \`pkg-pr-new-${ENV}\` (regenerated in this run)"
            fi
            if [ -n "${{ steps.create_pr.outputs.pull-request-head-sha }}" ]; then
              echo "- **PR:** #${{ steps.create_pr.outputs.pull-request-number }} (${{ steps.create_pr.outputs.pull-request-operation }} in this run)"
            fi
            echo
            echo '```'
            for pkg in @commercelayer/sdk @commercelayer/provisioning-sdk; do
              echo "npm i https://pkg.pr.new/${pkg}@${SHA}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
