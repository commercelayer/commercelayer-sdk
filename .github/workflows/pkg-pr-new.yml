name: Publish preview package

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      package:
        description: 'SDK package to regenerate'
        type: choice
        required: true
        default: '@commercelayer/sdk'
        options:
          - '@commercelayer/sdk'
          - '@commercelayer/provisioning-sdk'
      environment:
        description: 'Environment to regenerate the SDK against (resolved from that package sdk.config.ts)'
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
          - staging1
          - staging2
          - staging3
      api_version:
        description: 'Target API version (YYYY-MM). Leave empty for latest. Rejected against legacy-shape hosts (e.g. production today).'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    name: pkg.pr.new
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate ${{ inputs.package }} against ${{ inputs.environment }}
        if: github.event_name == 'workflow_dispatch'
        run: |
          ARGS="--env=${{ inputs.environment }}"
          if [ -n "${{ inputs.api_version }}" ]; then
            ARGS="$ARGS --api-version=${{ inputs.api_version }}"
          fi
          # Invoke tsx directly: `pnpm generate` chains `&& pnpm check`, and pnpm
          # appends user args to the LAST command in the chain — so
          # `pnpm generate --env=…` would hand the flag to `pnpm check` instead.
          # --env resolves through the package's own sdk.config.ts environments map,
          # so this step needs no knowledge of which API it is generating.
          pnpm --filter ${{ inputs.package }} exec tsx ../generator/src/generator.ts $ARGS
          pnpm check

      - name: Commit + push to pkg-pr-new-${{ inputs.environment }}
        if: github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: regenerate ${{ inputs.package }} against ${{ inputs.environment }}'
          branch: 'pkg-pr-new-${{ inputs.environment }}'
          push_options: '--force'
          create_branch: true
          commit_user_name: 'commercelayer-ci'
          commit_user_email: 'ci@commercelayer.io'

      - name: Build package
        run: pnpm build

      - name: Publish preview
        run: npx pkg-pr-new publish --no-template './packages/*'

      - name: Open PR to main (production dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head pkg-pr-new-production \
            --title 'chore: regenerate schema from production' \
            --body $'Automated schema regen via workflow dispatch.\n\nInstall the preview to test before merging:\n```\npnpm add https://pkg.pr.new/commercelayer/commercelayer-sdk@pkg-pr-new-production\n```' \
          || echo 'PR already open for pkg-pr-new-production; latest commit force-pushed.'
