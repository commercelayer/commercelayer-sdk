name: Release

# Drafts a GitHub release when a package tag is pushed. Release notes come from
# PR titles and labels via .github/release.yaml — there is no conventional-commit
# changelog. Nothing reaches npm here: publishing happens in publish.yml once a
# human publishes the draft.
#
# Versioning is independent, so each package owns a tag prefix rather than the
# bare `v*` namespace. Core has published 8 majors and provisioning is entering
# 3.x, so their version ranges overlap — bare `v*` for both would collide (core
# already holds `v3.1.1`).
#
# The prefix is the package's directory name, so the package can be derived
# rather than mapped: `core-sdk-v8.0.0` -> packages/core-sdk. Adding a target
# needs no change here.
#
# `*-v*` requires a prefix, so core's 368 legacy bare `v7.x`/`v8.x` tags stay
# inert. A tag whose prefix is not a package directory, or names a private
# package, fails loudly in the step below rather than being silently ignored.
on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  github_release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history and tags: the previous tag for *this* package has to be
          # discoverable.
          fetch-depth: 0

      - name: Resolve package and its previous tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # `core-sdk-v8.0.0-beta.12` -> dir `core-sdk`, version `8.0.0-beta.12`
          DIR="${TAG%%-v*}"
          VERSION="${TAG#*-v}"

          if [ ! -f "packages/${DIR}/package.json" ]; then
            echo "::error::Tag prefix '${DIR}' does not match a package directory."
            exit 1
          fi
          # The npm name, which need not match the directory: packages/core-sdk
          # publishes as @commercelayer/sdk until that package is renamed.
          PKG=$(node -p "require('./packages/${DIR}/package.json').name")
          if [ "$(node -p "require('./packages/${DIR}/package.json').private === true")" = "true" ]; then
            echo "::error::${PKG} is private and must not be released."
            exit 1
          fi

          # GitHub's generated notes diff against the previous tag, which it
          # picks chronologically. With two packages' tags interleaved that is
          # usually the *other* package, so pin it to this package's own prefix.
          PREV=$(git tag --list "${DIR}-v*" --sort=-creatordate | grep -vFx "$TAG" | head -1 || true)

          # A semver prerelease has a hyphen in the version (8.0.0-beta.12).
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac

          {
            echo "package=$PKG"
            echo "version=$VERSION"
            echo "previous_tag=$PREV"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Drafting $PKG v$VERSION (prerelease=$PRERELEASE, previous=${PREV:-none})"

      - name: Create a draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.COMMERCELAYER_CI_TOKEN }}
          name: ${{ steps.meta.outputs.package }} v${{ steps.meta.outputs.version }}
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          previous_tag: ${{ steps.meta.outputs.previous_tag }}
